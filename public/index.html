<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sunnyvale Weather</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <img class="banner" src="banner.jpg" alt="Fog over the hills above Sunnyvale" />
    <main class="dashboard">
        <header class="dashboard-header">
            <div class="heading">
                <h1>Sunnyvale Weather</h1>
                <p class="subtitle">Live conditions from the backyard station</p>
            </div>
            <div class="header-controls">
                <button id="unit-toggle" class="pill-button" type="button" aria-label="Switch units">°F</button>
                <button id="refresh-button" class="pill-button" type="button" aria-label="Refresh now">⟳</button>
            </div>
        </header>

        <p id="status-line" class="status-line" role="status">Loading current conditions&hellip;</p>

        <section class="grid" id="tile-grid" aria-live="polite">
            <article class="card card-temp" data-tile="temp">
                <h2>Temperature</h2>
                <div class="temp-body">
                    <div class="ring temp-ring">
                        <span class="num">&ndash;</span><span class="unit">°F</span>
                    </div>
                    <dl class="temp-meta">
                        <div class="meta-row">
                            <dt>Humidity</dt>
                            <dd class="humidity">&ndash;</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Dew Point</dt>
                            <dd class="dew-point">&ndash;</dd>
                        </div>
                    </dl>
                </div>
                <p class="feels-like">Feels like <strong>&ndash;</strong></p>
            </article>

            <article class="card card-wind" data-tile="wind">
                <h2>Wind</h2>
                <div class="ring wind-ring">
                    <div class="compass"><span class="arrow-head"></span></div>
                    <span class="num">&ndash;</span><span class="unit">mph</span>
                    <span class="gust">G &ndash; mph</span>
                </div>
            </article>

            <article class="card card-pressure" data-tile="pressure">
                <h2>Pressure</h2>
                <div class="ring pressure-ring">
                    <span class="needle"></span>
                </div>
                <p class="pressure-value"><span class="num">&ndash;</span> <span class="unit">inHg</span></p>
            </article>

            <article class="card card-rain" data-tile="rain">
                <h2>Rain</h2>
                <div class="jars">
                    <div class="jar">
                        <div class="jar-body">
                            <div class="jar-fill"></div>
                        </div>
                        <p class="jar-value">&ndash;</p>
                        <p class="jar-label">Day</p>
                    </div>
                    <div class="jar">
                        <div class="jar-body">
                            <div class="jar-fill"></div>
                        </div>
                        <p class="jar-value">&ndash;</p>
                        <p class="jar-label">Month</p>
                    </div>
                </div>
            </article>

            <article class="card card-solar" data-tile="solar">
                <h2>Sunshine</h2>
                <div class="sun-disc">
                    <div class="sun-core"></div>
                </div>
                <p class="solar-value"><span class="num">&ndash;</span> <span class="unit">W/m²</span></p>
            </article>
        </section>

        <p class="last-updated" id="last-updated"></p>
    </main>

    <script src="script.js"></script>
</body>

</html>
