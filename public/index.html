<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sunnyvale Weather</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <div class="heading">
                <h1>Sunnyvale Weather</h1>
                <p class="subtitle">Live conditions from the backyard station</p>
            </div>
            <div class="header-controls">
                <button id="unit-toggle" class="pill-button" type="button" aria-label="Switch units">°F</button>
                <button id="refresh-button" class="pill-button" type="button" aria-label="Refresh now">⟳</button>
            </div>
        </header>

        <p id="status-line" class="status-line" role="status">Loading current conditions&hellip;</p>

        <section class="grid" id="tile-grid" aria-live="polite">
            <article class="card" data-tile="temp">
                <h2>Temperature</h2>
                <p class="value"><span class="num">&ndash;</span><span class="unit">°F</span></p>
                <p class="sub">Feels like <span class="feels-like">&ndash;</span></p>
            </article>

            <article class="card" data-tile="humidity">
                <h2>Humidity</h2>
                <p class="value"><span class="num">&ndash;</span><span class="unit">%</span></p>
                <p class="sub">Dew point <span class="dew-point">&ndash;</span></p>
            </article>

            <article class="card" data-tile="wind">
                <h2>Wind</h2>
                <p class="value"><span class="num">&ndash;</span><span class="unit">mph</span></p>
                <p class="sub">Gusting <span class="gust">&ndash;</span> &middot; <span class="dir">&ndash;</span></p>
            </article>

            <article class="card" data-tile="pressure">
                <h2>Pressure</h2>
                <p class="value"><span class="num">&ndash;</span><span class="unit">inHg</span></p>
                <p class="sub trend">&ndash;</p>
            </article>

            <article class="card" data-tile="rain">
                <h2>Rainfall</h2>
                <p class="value"><span class="num">&ndash;</span><span class="unit">in</span></p>
                <p class="sub">Rate <span class="rain-rate">&ndash;</span></p>
            </article>

            <article class="card" data-tile="solar">
                <h2>Solar Radiation</h2>
                <p class="value"><span class="num">&ndash;</span><span class="unit">W/m²</span></p>
                <p class="sub">UV index <span class="uv">&ndash;</span></p>
            </article>
        </section>

        <p class="last-updated" id="last-updated"></p>
    </main>

    <script src="script.js"></script>
</body>

</html>
